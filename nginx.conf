# ─── nginx — BROkar React SPA ─────────────────────────────────────────────────

# Gzip: compresses JS/CSS/JSON before sending — reduces bundle sizes by ~70%.
# Required for any real-world React app (Radix UI + Recharts bundles are large).
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_vary         on;
gzip_proxied      any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers for static content ──────────────────────────────────
    # (Helmet handles these for /api/* — nginx handles them for the SPA shell)
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Static assets — long cache + immutable ────────────────────────────────
    # Vite appends content hashes (e.g. /assets/index-Bx3kR9.js) so these
    # files can be cached forever; the hash changes whenever content changes.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check (used by Docker / load balancers) ────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── All other routes → React index.html (client-side routing) ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
